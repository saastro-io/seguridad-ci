name: semgrep
# Exigido por la regla de la org saastro-io (decisión 01M5JAWH88, 22-oct):
# análisis estático de lo que el PR añade frente a su base. Versión fijada
# (1.182.0, publicada el 20-oct: más vieja que la cuarentena de un día).
on:
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  # Prefijo propio: el repo consumidor puede tener un workflow con el mismo nombre
  # (saastro-office tiene su `gitleaks`) y compartir grupo cancelaba su job.
  group: seguridad-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  semgrep:
    # Repos privados: el Mac de JC (runners de org mac-jc-1..4, sin minutos). Públicos: ubuntu,
    # porque un PR de fork no debe ejecutar código en el Mac (revisión de seguridad, P2).
    # Sin `container:` (solo Linux): semgrep 1.182.0 fijado, en un venv propio de cada job.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","mac-jc"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar semgrep 1.182.0
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --quiet semgrep==1.182.0
          echo "$RUNNER_TEMP/semgrep-venv/bin" >> "$GITHUB_PATH"
      - name: semgrep (solo lo nuevo del PR)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          # Fuera la regla que pide 7 días de cuarentena en pnpm: la política de la casa
          # es 1 día (doc 78, JC 22-oct) y la mide el semáforo; se revisa el 23-oct.
          semgrep scan --config p/default --baseline-commit "$BASE_SHA" --error --metrics=off --disable-version-check \
            --exclude-rule package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age
